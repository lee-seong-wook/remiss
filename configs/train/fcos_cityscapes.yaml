seed: 42
device: auto
amp: true
output_dir: runs/train

data:
  train_images: ${TRAIN_IMAGES}
  train_annotations: ${TRAIN_ANNOTATIONS}
  val_images: ${VAL_IMAGES}
  val_annotations: ${VAL_ANNOTATIONS}

loader:
  batch_size: 16
  num_workers: 8
  pin_memory: true
  shuffle: true

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: false

scheduler:
  name: multistep
  unit: iteration
  milestones: [3500, 4000]
  gamma: 0.1

train:
  epochs: 1000
  max_iterations: 5000
  grad_clip_norm: 1.0
  log_interval: 100
  eval_every_epochs: 1
  eval_every_iterations: 200

checkpoint:
  dir: checkpoints
  resume: null
  resume_optimizer: true
  resume_scheduler: false
  reset_optimizer_lr: false
  save_last: true
  save_best: true
  save_every_epochs: 20
  monitor: bbox_mAP_50_95
  mode: max

metrics:
  type: coco_detection
  iou_types: [bbox]
  primary: bbox_mAP_50_95
